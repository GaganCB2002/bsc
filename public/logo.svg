<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#002D62" stroke-width="2"/>
  
  <!-- Text Paths -->
  <!-- Top arc, from left to right -->
  <path id="topArc" d="M 12 50 A 38 38 0 0 1 88 50" fill="none"/>
  <!-- Bottom arc, from left to right -->
  <path id="bottomArc" d="M 17 50 A 33 33 0 0 0 83 50" fill="none"/>
  
  <!-- Text -->
  <text fill="#002D62" font-family="Arial, sans-serif" font-weight="900" font-size="10.5" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">B.S. CHANNABASAPPA</textPath>
  </text>
  <text fill="#002D62" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SILKS &amp; SAREES</textPath>
  </text>
  <text x="50" y="78" fill="#002D62" font-family="Arial, sans-serif" font-weight="bold" font-size="6" text-anchor="middle" letter-spacing="0.5">SINCE 1938</text>

  <!-- 3 Leaves in Center -->
  <g fill="#002D62" transform="translate(50, 46)">
    <path d="M 0,-1 C -5,-7 -5,-15 0,-18 C 5,-15 5,-7 0,-1 Z" />
    <path d="M 0,-1 C -5,-7 -5,-15 0,-18 C 5,-15 5,-7 0,-1 Z" transform="rotate(120)" />
    <path d="M 0,-1 C -5,-7 -5,-15 0,-18 C 5,-15 5,-7 0,-1 Z" transform="rotate(240)" />
    <circle cx="0" cy="-1" r="2" fill="#002D62"/>
  </g>
</svg>
